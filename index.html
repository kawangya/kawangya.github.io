<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中...</title>
    <!-- 方法1：Meta 标签极速刷新跳转 -->
    <meta http-equiv="refresh" content="0; url='https://你的用户名.github.io/目标仓库名/'">
    <script>
        // 方法2：JS 强制跳转（防止部分浏览器不识别 meta）
        window.location.replace("https://你的用户名.github.io/目标仓库名/");
    </script>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial, sans-serif;background:#f5f7fa;color:#333;">
    <div style="text-align:center;">
        <p>正在跳转至目标站点...</p>
        <p style="font-size:14px;color:#999;">若无反应，请 <a href="https://你的用户名.github.io/目标仓库名/" style="color:#0366d6;">点击此处</a></p>
    </div>
</body>
</html>
